# /etc/nginx/sites-available/mezbahateknolojileri.com.conf  (sites-enabled'e symlink)
# HAZIRLIK DOSYASI — sunucuda uygulanmadı. Yer tutucu yolları (<...>) dağıtım öncesi doldurun.
#
# Amaç (kanonik origin = https://www.mezbahateknolojileri.com):
#   http://mezbahateknolojileri.com      -> 301 https://www.mezbahateknolojileri.com$request_uri   (tek adım)
#   http://www.mezbahateknolojileri.com  -> 301 https://www.mezbahateknolojileri.com$request_uri   (tek adım)
#   https://mezbahateknolojileri.com     -> 301 https://www.mezbahateknolojileri.com$request_uri   (tek adım)
#   https://www.mezbahateknolojileri.com -> Next.js uygulaması (127.0.0.1:3000)
#
# Yol/sorgu koruması: `$request_uri` istemcinin gönderdiği ham URI'dir (sondaki "/" ve sorgu
# dizesi dahil, normalizasyonsuz). Bu dosyada `rewrite`, `try_files` ile "/" ekleme/atma veya
# `absolute_redirect` oyunu YOKTUR — sondaki "/" yönetimi tamamen uygulamadadır (src/proxy.ts),
# aksi halde /tr/x/ -> /tr/x -> hedef zinciri yeniden oluşur.
#
# Cloudflare önde (proxied) olduğu için: Cloudflare SSL modu "Full (strict)" olmalı ve bu sunucuda
# geçerli bir sertifika (Cloudflare Origin CA veya Let's Encrypt) bulunmalıdır. Gerçek istemci IP'si
# için /etc/nginx/conf.d/cloudflare-realip.conf (deploy/nginx/cloudflare-realip-update.sh üretir) gerekir.
#
# Güvenlik başlıkları (HSTS, X-Frame-Options, nosniff, Referrer-Policy, Permissions-Policy)
# UYGULAMA tarafından ekleniyor (next.config.ts) — burada TEKRAR eklemeyin (çift başlık olur).
# Not: nginx'in kendi gzip'i kapalı bırakıldı; Next.js yanıtları zaten sıkıştırıyor, Cloudflare
# kenarda brotli/gzip uyguluyor.

upstream mezbaha_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Yönetici girişi için oran sınırı (uygulamada henüz brute-force koruması yok).
limit_req_zone $binary_remote_addr zone=mezbaha_login:10m rate=10r/m;

# ---------------------------------------------------------------------------
# Tanınmayan host / doğrudan IP: hiçbir içerik sızdırma
# ---------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;       # nginx >= 1.19.4
}

# ---------------------------------------------------------------------------
# HTTP (80): her iki host da doğrudan kanonik HTTPS www'ye — TEK adım
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name mezbahateknolojileri.com www.mezbahateknolojileri.com;

    # (Yalnızca Let's Encrypt HTTP-01 kullanılırsa) doğrulama yolu yönlendirilmez:
    # location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }

    location / {
        return 301 https://www.mezbahateknolojileri.com$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS apex (443): kalıcı yönlendirme -> www (tek adım, yol + sorgu korunur)
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                      # nginx >= 1.25.1 (eski sürümde: listen 443 ssl http2;)
    server_name mezbahateknolojileri.com;

    include /etc/nginx/snippets/mezbaha-ssl.conf;   # sertifika + protokoller (aşağıya bkz.)

    location / {
        return 301 https://www.mezbahateknolojileri.com$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS www (443): uygulama
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.mezbahateknolojileri.com;

    include /etc/nginx/snippets/mezbaha-ssl.conf;

    # Admin medya yüklemesi: uygulama 8 MB'a izin verir, Server Actions gövde sınırı 10mb
    # (next.config.ts). Multipart ek yükü için nginx sınırı bunların ÜSTÜNDE olmalı.
    client_max_body_size 12m;

    # Gizli/nokta dosyalar (Let's Encrypt .well-known hariç)
    location ~ /\.(?!well-known) {
        deny all;
    }

    # Yönetici giriş sayfası: oran sınırı (GET ve server-action POST'ları)
    location = /admin/login {
        limit_req zone=mezbaha_login burst=10 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/mezbaha-proxy.conf;
        proxy_pass http://mezbaha_app;
    }

    # Admin'den yüklenen dosyalar. STORAGE_PROVIDER=s3 iken görseller özel S3 kovasında tutulur; uygulama
    # /uploads/... isteklerini kovadan okuyup sunar (aynı alan adı, aynı yol). nginx yalnızca önbellek başlığını
    # sabitler. (Eski STORAGE_PROVIDER=local kurulumunda burada `alias /srv/mezbaha/shared/uploads/;` kullanılıyordu.)
    location ^~ /uploads/ {
        include /etc/nginx/snippets/mezbaha-proxy.conf;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        proxy_pass http://mezbaha_app;
    }

    # Ürün/blog/kategori/hero görselleri (/images/...): S3 kovasından uygulama üzerinden sunulur (logo/ikon gibi SVG'ler
    # public/ içinde kalır). Dosya adları içerik-hash'li olmadığından makul bir 7 günlük önbellek.
    location ^~ /images/ {
        include /etc/nginx/snippets/mezbaha-proxy.conf;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=604800" always;
        proxy_pass http://mezbaha_app;
    }

    # Her şey: Next.js (HTML, RSC/streaming, /_next/static (immutable başlığı Next'ten gelir),
    # /_next/image, sitemap.xml, robots.txt, llms.txt, eski /tr/... yollar, /admin ...)
    location / {
        include /etc/nginx/snippets/mezbaha-proxy.conf;
        proxy_pass http://mezbaha_app;     # URI kısmı YOK: istek olduğu gibi (slash + sorgu) iletilir
    }
}
