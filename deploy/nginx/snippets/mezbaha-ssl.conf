# /etc/nginx/snippets/mezbaha-ssl.conf
# Sertifika yolları YER TUTUCUDUR — hangisini kullanacağınızı seçin (sırlar burada değil, yalnızca yollar).
#
# Seçenek A (önerilen, Cloudflare proxied + Full (strict)): Cloudflare Origin CA sertifikası
#   Cloudflare paneli > SSL/TLS > Origin Server > Create Certificate (hostnames: mezbahateknolojileri.com,
#   *.mezbahateknolojileri.com veya yalnızca www + apex). Dosyalar sunucuda root:root, anahtar 600.
ssl_certificate     /etc/ssl/cloudflare/mezbahateknolojileri.com.pem;
ssl_certificate_key /etc/ssl/cloudflare/mezbahateknolojileri.com.key;
#
# Seçenek B: Let's Encrypt (certbot). Cloudflare proxied iken HTTP-01 bazen zor olur; DNS-01 önerilir.
# ssl_certificate     /etc/letsencrypt/live/www.mezbahateknolojileri.com/fullchain.pem;
# ssl_certificate_key /etc/letsencrypt/live/www.mezbahateknolojileri.com/privkey.pem;

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# İsteğe bağlı sertleştirme (Cloudflare "Authenticated Origin Pulls" açıksa):
# ssl_client_certificate /etc/ssl/cloudflare/authenticated_origin_pull_ca.pem;
# ssl_verify_client on;
# (Açıkken `curl --resolve` ile doğrudan-origin testleri istemci sertifikası gerektirir.)
