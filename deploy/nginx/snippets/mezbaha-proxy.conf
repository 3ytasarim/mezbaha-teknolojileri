# /etc/nginx/snippets/mezbaha-proxy.conf
# Next.js uygulamasına ortak proxy ayarları. `location` bloklarından `include` edilir.
#
# ÖNEMLİ: `proxy_pass` hattında URI KISMI YOKTUR (sonunda "/" yok). Bu sayede istek URI'si
# (sondaki "/" ve sorgu dizesi dahil) uygulamaya BİREBİR iletilir; nginx hiçbir yol normalizasyonu
# yapmaz. Eski URL'ler (/tr/x/) uygulamanın proxy.ts'inde tek adımda 301'lenir (Phase 11D).

proxy_http_version 1.1;
proxy_set_header Connection "";                 # upstream keepalive için
proxy_set_header Host              $host;       # www.mezbahateknolojileri.com
proxy_set_header X-Real-IP         $remote_addr;      # Cloudflare real_ip ile gerçek istemci
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;    # bu sunucuda TLS sonlandığı için https
proxy_set_header X-Forwarded-Host  $host;

# Next.js streaming (RSC / Suspense) için tamponlama kapalı: parçalar hemen istemciye akar.
proxy_buffering off;
proxy_request_buffering on;                     # server action (form/yükleme) gövdeleri tamponlanır
proxy_read_timeout 60s;
proxy_send_timeout 60s;
proxy_connect_timeout 5s;
